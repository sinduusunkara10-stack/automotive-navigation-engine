<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Request a Quote</title>
  </head>
  <body>
    <h1>Request a Quote</h1>
    <form id="lead-form">
      <label for="first-name">First name</label>
      <input type="text" id="first-name" name="firstName" required />
      <label for="last-name">Last name</label>
      <input type="text" id="last-name" name="lastName" required />
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <div id="dealer-widget">
        <label for="dealer-postcode">CP or city</label>
        <input type="text" id="dealer-postcode" name="dealerPostcode" required />
        <button type="button" id="dealer-ok-btn">OK</button>
        <div id="dealer-result-placeholder">Select a dealer</div>
      </div>

      <!-- Deliberately no hidden identifier field anywhere in the form -- this fixture
           reproduces the original production false positive: the widget's own loading/status
           text grows, but nothing is ever genuinely committed. -->
      <div id="confirmation" style="display: none">Thank you! We'll be in touch soon.</div>
      <button type="submit" id="submit-lead">Submit</button>
    </form>
    <script>
      // Clicking OK only ever rewrites the placeholder's own visible text to a longer loading
      // message -- never a selectable role="radio"/role="option" result, never a hidden input.
      document.getElementById("dealer-ok-btn").addEventListener("click", () => {
        document.getElementById("dealer-result-placeholder").textContent = "Searching nearby dealers for your area, please wait a moment while we check availability...";
      });
    </script>
  </body>
</html>
