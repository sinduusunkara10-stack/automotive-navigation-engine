<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Owner Services</title>
  </head>
  <body>
    <h2>Book a service appointment</h2>
    <form id="service-form" method="get" action="/service-thank-you.html">
      <label for="service-first-name">First name</label>
      <input type="text" id="service-first-name" name="firstName" required />
      <label for="service-last-name">Last name</label>
      <input type="text" id="service-last-name" name="lastName" required />
      <label for="service-email">Email</label>
      <input type="email" id="service-email" name="email" required />
      <button type="submit">Book my appointment</button>
    </form>
    <h1>Our electricity offers</h1>
    <form id="electricity-form" method="get" action="/electricity-thank-you.html">
      <label for="elec-first-name">First name</label>
      <input type="text" id="elec-first-name" name="firstName" required />
      <label for="elec-email">Email</label>
      <input type="email" id="elec-email" name="email" required />
      <button type="submit">Continue</button>
    </form>
  </body>
</html>
