<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Essayer la voiture</title>
  </head>
  <body>
    <h1>Essai routier</h1>
    <form id="lead-form">
      <label for="prenom">Prénom</label>
      <input type="text" id="prenom" name="prenom" required />
      <label for="nom">Nom</label>
      <input type="text" id="nom" name="nom" required />
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required />
      <label for="mobile">Téléphone portable</label>
      <input type="tel" id="mobile" name="mobile" required />
      <div id="confirmation" style="display: none">Merci ! Nous vous contacterons bientôt.</div>
      <button type="submit" id="submit-lead">Soumettre</button>
    </form>
    <script>
      document.getElementById("lead-form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.getElementById("confirmation").style.display = "block";
      });
    </script>
  </body>
</html>
