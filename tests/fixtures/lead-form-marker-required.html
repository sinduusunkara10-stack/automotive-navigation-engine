<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Request a quote</title>
  </head>
  <body>
    <h1>Request a quote</h1>
    <form id="quote-form" method="get" action="/lead-form-thank-you.html">
      <div>
        <label for="civility">Civilite</label><span class="required-marker">*</span>
        <select id="civility" name="civility">
          <option value="">Select</option>
          <option value="M">M.</option>
          <option value="Mme">Mme</option>
        </select>
      </div>
      <div>
        <label for="first-name">Prenom *</label>
        <input type="text" id="first-name" name="firstName" />
      </div>
      <div>
        <label for="last-name">Nom</label><span>*</span>
        <input type="text" id="last-name" name="lastName" />
      </div>
      <div>
        <label for="email">E-mail *</label>
        <input type="email" id="email" name="email" />
      </div>
      <button type="submit" id="submit-lead">Valider</button>
    </form>
  </body>
</html>
