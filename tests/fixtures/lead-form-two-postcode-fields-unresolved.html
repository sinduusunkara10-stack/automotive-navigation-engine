<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Request a Quote</title>
  </head>
  <body>
    <h1>Request a Quote</h1>
    <form id="lead-form">
      <label for="first-name">First name</label>
      <input type="text" id="first-name" name="firstName" required />
      <label for="last-name">Last name</label>
      <input type="text" id="last-name" name="lastName" required />
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="address-postcode">Postcode</label>
      <input type="text" id="address-postcode" name="addressPostcode" required />

      <!-- The dealer-locator postcode field's own trigger is placed far enough away (by visual
           distance -- see the inline style) that it falls outside both of tagAndFindLookupTriggers'
           sanity cutoffs. This simulates a genuine structural-detection miss (whatever its exact
           cause on a real site) so the engine never upgrades EITHER postcode field to
           dealer_search -- exactly the regression's own signature. The generic safety net must
           still catch this and block Submit, independent of why detection itself failed. -->
      <div id="dealer-widget">
        <label for="dealer-postcode">Postcode</label>
        <input type="text" id="dealer-postcode" name="dealerPostcode" required />
        <div style="margin-top: 900px;">
          <button type="button" id="dealer-search-btn">Search</button>
        </div>
        <div id="dealer-results" hidden>
          <label><input type="radio" name="dealerChoice" value="dealer-1" id="dealer-1" /> Dealer One</label>
        </div>
      </div>

      <input type="hidden" id="dealer-committed" name="dealerId" />
      <div id="confirmation" style="display: none">Thank you! We'll be in touch soon.</div>
      <button type="submit" id="submit-lead">Submit</button>
    </form>
    <script>
      document.getElementById("dealer-search-btn").addEventListener("click", () => {
        document.getElementById("dealer-results").hidden = false;
      });
      document.querySelectorAll('input[name="dealerChoice"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          document.getElementById("dealer-committed").value = radio.value;
        });
      });
      document.getElementById("lead-form").addEventListener("submit", (event) => {
        event.preventDefault();
        if (!document.getElementById("dealer-committed").value) return;
        document.getElementById("confirmation").style.display = "block";
      });
    </script>
  </body>
</html>
