<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Request a quote</title>
  </head>
  <body>
    <h1>Request a quote</h1>
    <form id="quote-form" method="get" action="/lead-form-thank-you.html">
      <input type="hidden" name="firstName" value="stale-backing-value" />
      <div>
        <label for="first-name-display">First name *</label>
        <input type="text" id="first-name-display" name="firstName_display" />
      </div>
      <input type="hidden" name="email" value="stale@example.com" />
      <div>
        <label for="email-display">Email *</label>
        <input type="email" id="email-display" name="email_display" />
      </div>
      <button type="submit" id="submit-lead">Valider</button>
    </form>
  </body>
</html>
