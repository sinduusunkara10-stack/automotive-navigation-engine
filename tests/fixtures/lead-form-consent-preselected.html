<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Request a quote</title>
  </head>
  <body>
    <h1>Request a quote</h1>
    <form id="lead-form">
      <label for="first-name">First name</label>
      <input type="text" id="first-name" name="firstName" required />
      <label for="last-name">Last name</label>
      <input type="text" id="last-name" name="lastName" required />
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <fieldset>
        <legend>Would you like to receive our newsletter and special offers?</legend>
        <label><input type="radio" name="news" value="yes" id="news-yes" /> Yes</label>
        <label><input type="radio" name="news" value="no" id="news-no" checked /> No</label>
      </fieldset>

      <fieldset>
        <legend>May we tailor offers to your interests (profiling)?</legend>
        <label><input type="radio" name="prof" value="yes" id="prof-yes" checked /> Yes</label>
        <label><input type="radio" name="prof" value="no" id="prof-no" /> No</label>
      </fieldset>

      <p id="error" role="alert"></p>
      <div id="confirmation" style="display: none">Thank you, your request has been received.</div>
      <button type="submit" id="submit-lead">Send</button>
    </form>
    <script>
      // The widget state is only recorded from a real click, as some frameworks do: the "No"
      // rendered as checked by default is not yet an answer until it is clicked.
      const answers = {};
      document.querySelectorAll('input[type="radio"]').forEach((radio) => {
        radio.addEventListener("click", () => {
          answers[radio.name] = radio.value;
        });
      });
      document.getElementById("lead-form").addEventListener("submit", (event) => {
        event.preventDefault();
        if (answers.news === undefined || answers.prof === undefined) {
          document.getElementById("error").textContent = "Please answer every question.";
          return;
        }
        window.__answers = answers;
        document.getElementById("confirmation").style.display = "block";
      });
    </script>
  </body>
</html>
