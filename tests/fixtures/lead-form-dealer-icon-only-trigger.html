<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Request a Quote</title>
  </head>
  <body>
    <h1>Request a Quote</h1>
    <form id="lead-form">
      <label for="first-name">First name</label>
      <input type="text" id="first-name" name="firstName" required />
      <label for="last-name">Last name</label>
      <input type="text" id="last-name" name="lastName" required />
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <!-- Real production regression: the lookup button carries no accessible text at all
           (an icon-only button rendered via CSS background, or -- on the live Peugeot run this
           fixture reproduces -- an untranslated i18n placeholder like "{formButton}"). It is
           still the single, correctly-associated structural match for this field (ARIA/ancestor-
           hop/pixel-distance all pass), so the engine must trust that structural association by
           itself instead of requiring the trigger's own text to carry lookup vocabulary. -->
      <label for="dealer-postcode">CP ou ville</label>
      <input type="text" id="dealer-postcode" name="dealerPostcode" required />
      <button type="button" id="dealer-search-btn" aria-label=""></button>
      <div id="dealer-results" hidden>
        <label><input type="radio" name="dealerChoice" value="dealer-1" id="dealer-1" /> Dealer One</label>
        <label><input type="radio" name="dealerChoice" value="dealer-2" id="dealer-2" /> Dealer Two</label>
      </div>
      <input type="hidden" id="dealer-committed" name="dealerId" />
      <div id="confirmation" style="display: none">Thank you! We'll be in touch soon.</div>
      <div id="dealer-error" class="error-message" role="alert" hidden>Please select a dealer before submitting.</div>
      <button type="submit" id="submit-lead">Submit</button>
    </form>
    <script>
      document.getElementById("dealer-search-btn").addEventListener("click", () => {
        document.getElementById("dealer-results").hidden = false;
      });
      document.querySelectorAll('input[name="dealerChoice"]').forEach((radio) => {
        radio.addEventListener("change", () => {
          document.getElementById("dealer-committed").value = radio.value;
        });
      });
      document.getElementById("lead-form").addEventListener("submit", (event) => {
        if (!document.getElementById("dealer-committed").value) {
          event.preventDefault();
          document.getElementById("dealer-error").hidden = false;
          return;
        }
        event.preventDefault();
        document.getElementById("confirmation").style.display = "block";
      });
    </script>
  </body>
</html>
