<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Model Range</title>
  </head>
  <body>
    <form id="register-form" method="get" action="/register-thank-you.html" style="position: absolute; left: -9999px; top: -9999px;">
      <h2>Register</h2>
      <label for="reg-first-name">First name</label>
      <input type="text" id="reg-first-name" name="firstName" required />
      <label for="reg-last-name">Last name</label>
      <input type="text" id="reg-last-name" name="lastName" required />
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" name="email" required />
      <label for="reg-mobile">Mobile</label>
      <input type="tel" id="reg-mobile" name="mobile" required />
      <label for="reg-postcode">Postcode</label>
      <input type="text" id="reg-postcode" name="postcode" required />
      <button type="submit">Register</button>
    </form>
    <h1>Request a quote</h1>
    <form id="quote-form" method="get" action="/quote-thank-you.html">
      <label for="quote-first-name">First name</label>
      <input type="text" id="quote-first-name" name="firstName" required />
      <label for="quote-email">Email</label>
      <input type="email" id="quote-email" name="email" required />
      <button type="submit">Request a quote</button>
    </form>
  </body>
</html>
