<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Find stock near you</title>
  </head>
  <body>
    <h1>Find stock near you</h1>
    <div id="location-gate">
      <label for="gate-postcode">Enter your postcode</label>
      <input type="text" id="gate-postcode" name="gatePostcode" />
      <label for="gate-radius">Search radius</label>
      <select id="gate-radius" name="gateRadius">
        <option value="" disabled selected>Please select</option>
        <option value="10">10 miles</option>
        <option value="25">25 miles</option>
      </select>
      <button
        type="button"
        id="gate-continue"
        onclick="if (document.getElementById('gate-radius').value) { document.getElementById('location-gate').style.display='none'; document.getElementById('stock-results').style.display='block'; }"
      >
        Continue
      </button>
    </div>
    <div id="stock-results" style="display: none">
      <h2>Stock results</h2>
    </div>
  </body>
</html>
