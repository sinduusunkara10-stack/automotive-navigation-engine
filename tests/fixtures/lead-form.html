<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Book a Test Drive</title>
    <meta
      name="description"
      content="Fixture lead-capture form for the local navigation-engine proof of concept -- proves the engine can reach a personal-data form without ever entering data into it."
    />
  </head>
  <body>
    <h1>Book a Test Drive</h1>
    <p>Enter your details and we'll contact you to arrange a test drive.</p>
    <form id="lead-form">
      <label for="full-name">Full name</label>
      <input type="text" id="full-name" name="fullName" />
      <label for="email">Email</label>
      <input type="email" id="email" name="email" />
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" />
      <button type="submit" id="submit-lead">Submit</button>
    </form>
  </body>
</html>
