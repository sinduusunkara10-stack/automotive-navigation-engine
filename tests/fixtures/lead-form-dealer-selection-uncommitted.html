<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Request a Quote</title>
  </head>
  <body>
    <h1>Request a Quote</h1>
    <form id="lead-form">
      <label for="first-name">First name</label>
      <input type="text" id="first-name" name="firstName" required />
      <label for="last-name">Last name</label>
      <input type="text" id="last-name" name="lastName" required />
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />
      <label for="dealer-postcode">Find a dealer</label>
      <input type="text" id="dealer-postcode" name="dealerPostcode" required />
      <button type="button" id="dealer-search-btn">Search</button>
      <div id="dealer-results" hidden>
        <!-- role="option" results with no click handler wired up at all: clicking one never
             sets aria-selected, simulating a widget whose own JS fails to commit the
             selection even though the click itself lands. -->
        <ul role="listbox">
          <li role="option" id="dealer-opt-1">Dealer One</li>
          <li role="option" id="dealer-opt-2">Dealer Two</li>
        </ul>
      </div>
      <input type="hidden" id="dealer-committed" name="dealerId" />
      <div id="dealer-error" class="error-message" role="alert" hidden>Please select a dealer before submitting.</div>
      <button type="submit" id="submit-lead">Submit</button>
    </form>
    <script>
      document.getElementById("dealer-search-btn").addEventListener("click", () => {
        document.getElementById("dealer-results").hidden = false;
      });
      document.getElementById("lead-form").addEventListener("submit", (event) => {
        if (!document.getElementById("dealer-committed").value) {
          event.preventDefault();
          document.getElementById("dealer-error").hidden = false;
        }
      });
    </script>
  </body>
</html>
