<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Request a Quote</title>
  </head>
  <body>
    <h1>Request a Quote</h1>
    <form id="lead-form">
      <label for="first-name">First name</label>
      <input type="text" id="first-name" name="firstName" required />
      <label for="last-name">Last name</label>
      <input type="text" id="last-name" name="lastName" required />
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <div id="dealer-widget">
        <label for="dealer-postcode">CP or city</label>
        <input type="text" id="dealer-postcode" name="dealerPostcode" required />
        <button type="button" id="dealer-ok-btn">OK</button>
        <div id="dealer-result-placeholder">Select a dealer</div>
      </div>

      <input type="hidden" id="dealer-committed" name="dealerId" />
      <div id="server-error" class="error-message" role="alert" hidden>We could not process your request. Please try again.</div>
      <div id="confirmation" style="display: none">Thank you! We'll be in touch soon.</div>
      <button type="submit" id="submit-lead">Submit</button>
    </form>
    <script>
      document.getElementById("dealer-ok-btn").addEventListener("click", () => {
        document.getElementById("dealer-result-placeholder").textContent = "Garage Laurence selected";
        document.getElementById("dealer-committed").value = "dealer-1";
      });
      // A request is sent, and this time the handler reveals a genuine, observable error
      // surface -- a role="alert" element the engine's own post-submit scan already looks for.
      document.getElementById("lead-form").addEventListener("submit", (event) => {
        event.preventDefault();
        fetch("/submit-check")
          .catch(() => {})
          .finally(() => {
            document.getElementById("server-error").hidden = false;
          });
      });
    </script>
  </body>
</html>
