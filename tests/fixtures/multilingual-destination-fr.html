<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Configurateur officiel de véhicules</title>
    <meta
      name="description"
      content="Configurateur officiel : voitures neuves à configurer, choisissez votre modèle et vos options."
    />
  </head>
  <body>
    <h1>Configurateur officiel</h1>
    <h2>Configurez votre future voiture</h2>
    <p>Découvrez nos voitures neuves à configurer selon vos envies.</p>
    <button type="button" data-model="modele-un">Choisir ce modèle</button>
    <button type="button" data-model="modele-deux">Choisir cette finition</button>
    <button type="button" data-model="modele-trois">Choisir cette couleur</button>
  </body>
</html>
