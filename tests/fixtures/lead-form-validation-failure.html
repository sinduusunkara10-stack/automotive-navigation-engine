<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Book a Test Drive</title>
  </head>
  <body>
    <h1>Book a Test Drive</h1>
    <form id="lead-form">
      <label for="first-name">First name</label>
      <input type="text" id="first-name" name="firstName" required />
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />
      <label for="preferred-contact-method">Preferred contact method</label>
      <input type="text" id="preferred-contact-method" name="preferredContactMethod" required />
      <button type="submit" id="submit-lead">Submit</button>
    </form>
  </body>
</html>
