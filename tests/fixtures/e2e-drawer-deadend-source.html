<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Support Center</title>
    <style>
      #support-drawer {
        display: none;
        position: fixed;
        top: 0;
        right: 0;
        width: 320px;
        height: 100%;
        background: white;
        border-left: 1px solid #ccc;
      }
    </style>
    <script>
      function showDrawer() {
        document.getElementById("support-drawer").style.display = "block";
      }
    </script>
  </head>
  <body>
    <h1>Support Center</h1>
    <button type="button" onclick="showDrawer()">Open Support Drawer</button>
    <button type="button" onclick="location.href = 'e2e-drawer-milestone.html'">Continue After Drawer</button>

    <div id="support-drawer" role="dialog" aria-modal="true" aria-label="Support Options">
      <h2>Support Options</h2>
      <p>No agents are currently available for this topic.</p>
    </div>
  </body>
</html>
