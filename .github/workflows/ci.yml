name: CI

# Runs automatically on every pull request and every push to main. Deliberately free:
# no Claude API calls, no ANTHROPIC_API_KEY, and it never triggers either manually
# dispatched paid Claude workflow (manual-claude-smoke-test.yml,
# manual-claude-full-local-journey.yml) — both keep workflow_dispatch as their only
# trigger, untouched by this file.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, schema validation, automated tests, Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real Redis for tests/integration/redisRealServer.test.ts, which exercises the
    # Redis-backed TaskStore (src/api/redisTaskStore.ts) against an actual server rather
    # than the ioredis-mock used by the rest of the suite -- see that test file's own
    # comment and docs/architecture.md "Memory stability". Exposed on localhost:6379,
    # matching that test's default REDIS_URL_FOR_TESTS. Every other test in this repo is
    # unaffected by whether this service is present; the real-Redis test itself skips
    # gracefully (not a failure) if it can't reach a Redis server, so removing this
    # service would only stop exercising the real wire protocol, not break CI.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches package.json "engines.node": ">=20".
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Validate task schemas
        run: npm run validate:schemas

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      # Uses only MockReasoningProvider / a deterministic fake Claude model client and
      # local fixtures under tests/fixtures — no real website, no real Claude API call,
      # and REASONING_PROVIDER/ANTHROPIC_API_KEY are never set anywhere in this job.
      - name: Run automated tests (mock reasoning provider only)
        run: npm test

      - name: Build Docker image (validation only, not pushed anywhere)
        run: docker build -t navigation-engine:ci .
