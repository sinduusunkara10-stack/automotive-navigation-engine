name: Manual Claude Full Local Journey Test

# workflow_dispatch is the ONLY trigger, deliberately. This workflow makes real, billed
# calls to the Claude API (see tests/manual/claudeFullLocalJourneyTest.ts) and must never
# fire automatically on push, pull_request, schedule, or any other event.
on:
  workflow_dispatch: {}

# Repository-wide minimal token permissions: this workflow only needs to read the repo.
permissions:
  contents: read

# Only one manual full-journey run at a time, across all branches/refs, so a second manual
# trigger can never overlap with (and double-bill) an in-flight run. New dispatches queue
# behind an in-flight run rather than cancelling it.
concurrency:
  group: manual-claude-full-local-journey
  cancel-in-progress: false

jobs:
  full-journey-test:
    name: Claude full local journey (local fictional fixture only, max 3 Claude calls)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Matches package.json "engines.node": ">=20".
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run typecheck

      - name: Validate task schemas
        run: npm run validate:schemas

      - name: Run automated tests (mock/fake reasoning provider only, no Claude API calls)
        run: npm test

      # ANTHROPIC_API_KEY and the rest of the Claude tuning env vars are scoped to this
      # single step only — no other step, job, or workflow-level env references them. The
      # secret is read exclusively via ${{ secrets.ANTHROPIC_API_KEY }}; it is never placed
      # in a command-line argument, written to a file, or logged. The shell check below only
      # tests whether the value is empty (`-z`) and never prints, measures, or echoes it.
      #
      # tests/manual/fullJourneyTask.ts caps the task at maxSteps: 3, which is a hard
      # ceiling on the number of reasoning.decide() calls the engine's own limits guard
      # will allow (src/core/loop.ts checks the limit before every decide() call) — this
      # is what enforces "at most 3 real Claude API calls, never a 4th", independent of
      # this workflow's env tuning. CLAUDE_MAX_RETRIES=0 additionally guarantees zero
      # retries within each of those calls.
      - name: Run Claude full local-journey test (up to 3 real, billed Claude API calls)
        env:
          REASONING_PROVIDER: claude
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Conservative tuning for a small number of structured navigation decisions
          # against the local fictional fixture (see src/reasoning/config.ts for
          # defaults/ceilings).
          CLAUDE_MODEL: claude-sonnet-5
          CLAUDE_MAX_OUTPUT_TOKENS: "256"
          CLAUDE_TIMEOUT_MS: "20000"
          # Hard requirement: no retry on failure for this workflow run.
          CLAUDE_MAX_RETRIES: "0"
          CLAUDE_MIN_CONFIDENCE: "0.5"
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Required repository secret ANTHROPIC_API_KEY is not configured. Add it under Settings > Secrets and variables > Actions, then re-run this workflow. (No key was logged.)"
            exit 1
          fi
          npm run fulljourney:claude
